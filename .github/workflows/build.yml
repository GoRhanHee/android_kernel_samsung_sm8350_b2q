name: Samsung SM8350 b2q Kernel Build

on:
  workflow_dispatch:
    inputs:
      Option:
        description: 'Do you want to include KernelSU?'
        required: true
        type: choice
        options:
          - y
          - n  

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: "Set up build environment"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev make libncurses5-dev git curl clang lld \
            libelf-dev erofs-utils android-sdk-libsparse-utils build-essential automake autoconf libtool pkg-config fuse3 e2fsprogs pv liblz4-dev uuid-dev \
            libfuse3-dev fuse3 f2fs-tools fuse2fs attr zlib1g-dev rsync \
            device-tree-compiler lz4 xz-utils zlib1g-dev openjdk-17-jdk gcc g++ python3 python-is-python3 p7zip-full          

      - name: "Import kernel source"
        uses: actions/checkout@v4    

      - name: "Setting permission"
        run: chmod +x build.sh

      - name: "Build for specific device"
        run: ./build.sh ${{ github.event.inputs.Option }}
